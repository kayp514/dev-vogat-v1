name: Release

on:
  push:
    branches:
      - main
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write
  repository-projects: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    if: github.event.pull_request.merged == true || github.event_name == 'push'
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Apply changesets
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npm run release
          title: "chore: version packages"
          commit: "chore: version packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug Changeset Outputs
        run: |
          echo "Changeset published: ${{ steps.changesets.outputs.published }}"

      - name: Get version
        id: get_version
        if: steps.changesets.outputs.published == 'true'
        run: |
          echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Debug Get Version Output
        if: steps.changesets.outputs.published == 'true'
        run: |
          echo "Extracted VERSION: ${{ env.VERSION }}"

      - name: Create GitHub Release
        if: steps.changesets.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.VERSION }}
        run: |
          echo "Creating release for version: $VERSION"
          CHANGELOG_SECTION=$(awk -v ver="$VERSION" '
            /^## / { if (p) { exit }; if ($2 == ver) { p=1; next } }
            p { print }
          ' CHANGELOG.md)

          echo "Changelog section for $VERSION:"
          echo "$CHANGELOG_SECTION"

          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes "$CHANGELOG_SECTION" \
            --draft=false \
            --prerelease=false